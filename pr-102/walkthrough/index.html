<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonar Quiz Walkthrough</title>
<!--
  Slide walkthrough of the Sonar Quiz System.
  Self-contained: no network, no libraries, so it opens from file:// like the product.
  Screenshots and pin positions: img/*.png and img/shots.js, regenerated by
  `npm run walkthrough:capture` (scripts/capture-walkthrough.mjs).
  Captions: the SLIDES array below. Keys: ← → space PageUp PageDown Home End.
-->
<style>
  :root {
    --ink: #e8edf2;
    --ink-soft: #a9b6c3;
    --ground: #0e1a26;
    --panel: #15283a;
    --rule: #26425c;
    --accent: #f2a93b;
    --pin: #ff5a36;
    --link: #8cc7ff;
    --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ground);
    color: var(--ink);
    font: 16px/1.5 var(--sans);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header.bar {
    display: flex; align-items: baseline; gap: 16px;
    padding: 12px max(20px, env(safe-area-inset-left)) 10px;
    border-bottom: 1px solid var(--rule);
  }
  .brand { font-weight: 700; letter-spacing: 0.02em; }
  .section { color: var(--accent); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.12em; }
  .counter { margin-left: auto; color: var(--ink-soft); font-variant-numeric: tabular-nums; font-size: 0.9rem; }
  .progress { height: 3px; background: var(--rule); }
  .progress > div { height: 100%; background: var(--accent); width: 0; transition: width 0.25s; }

  main { flex: 1; min-height: 0; display: flex; }
  .slide {
    flex: 1; min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(260px, 340px);
    gap: 24px;
    padding: 20px max(20px, env(safe-area-inset-left)) 16px;
  }
  .slide.text { grid-template-columns: minmax(0, 860px); justify-content: center; align-content: center; overflow: auto; }
  .slide.text.wide { grid-template-columns: minmax(0, 1240px); }
  h1 { font-size: 2.6rem; line-height: 1.15; margin: 0 0 12px; text-wrap: balance; }
  h2 { font-size: 1.45rem; line-height: 1.25; margin: 0 0 6px; text-wrap: balance; }
  .lede { color: var(--ink-soft); font-size: 1.1rem; max-width: 62ch; margin: 0 0 18px; }

  figure { margin: 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .shot { position: relative; max-height: 100%; max-width: 100%; aspect-ratio: var(--ratio, 1280 / 800); }
  .shot img {
    display: block; width: 100%; height: 100%; object-fit: contain;
    border: 1px solid var(--rule); border-radius: 6px; background: #fff;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  }
  .mark {
    position: absolute; border: 2px solid var(--pin); border-radius: 4px;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.7); pointer-events: none;
    transition: box-shadow 0.15s;
  }
  .mark.hot { box-shadow: 0 0 0 1px #fff, 0 0 0 5px rgba(255, 90, 54, 0.35); }
  .pin {
    position: absolute; transform: translate(-50%, -50%);
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--pin); color: #fff; border: 2px solid #fff;
    font: 700 14px/24px var(--sans); text-align: center;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    cursor: default; transition: transform 0.15s;
  }
  .pin.hot, .pin:hover { transform: translate(-50%, -50%) scale(1.35); z-index: 2; }

  aside.notes { min-height: 0; overflow: auto; padding-right: 4px; }
  aside.notes h2 { margin-bottom: 10px; }
  aside.notes p.intro { color: var(--ink-soft); margin: 0 0 14px; }
  ol.callouts { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  ol.callouts li {
    display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start;
    padding: 8px 10px; border-radius: 6px; background: var(--panel); border: 1px solid transparent;
  }
  ol.callouts li.hot { border-color: var(--pin); }
  ol.callouts .num {
    width: 24px; height: 24px; border-radius: 50%; background: var(--pin); color: #fff;
    font: 700 13px/24px var(--sans); text-align: center;
  }
  .ref { display: block; margin-top: 2px; font-size: 0.78rem; color: var(--ink-soft); }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; }
  .card b { color: var(--accent); display: block; margin-bottom: 4px; }
  ul.plain { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
  code, pre { font-family: var(--mono); font-size: 0.85rem; }
  pre {
    background: #08121b; border: 1px solid var(--rule); border-radius: 6px;
    padding: 12px 14px; overflow-x: auto; margin: 6px 0 14px; line-height: 1.45;
  }
  .table-wrap { overflow: auto; max-height: 52vh; border: 1px solid var(--rule); border-radius: 6px; }
  table.csv { border-collapse: collapse; font-size: 0.78rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.csv th, table.csv td { padding: 5px 10px; border-bottom: 1px solid var(--rule); text-align: left; }
  table.csv th { position: sticky; top: 0; background: var(--panel); color: var(--accent); }
  table.csv th.new { color: var(--pin); }
  a { color: var(--link); }
  .note { font-size: 0.85rem; color: var(--ink-soft); }

  nav.controls {
    display: flex; gap: 10px; align-items: center; justify-content: center;
    padding: 8px 16px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--rule);
  }
  nav.controls button {
    background: var(--panel); color: var(--ink); border: 1px solid var(--rule);
    border-radius: 6px; padding: 6px 16px; font: inherit; cursor: pointer;
  }
  nav.controls button:hover:not(:disabled) { border-color: var(--accent); }
  nav.controls button:disabled { opacity: 0.4; cursor: default; }
  nav.controls button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint { color: var(--ink-soft); font-size: 0.8rem; }

  @media (max-width: 900px) {
    body { overflow: auto; }
    .slide { grid-template-columns: minmax(0, 1fr); }
    h1 { font-size: 2rem; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="bar">
  <span class="brand">Sonar Quiz System</span>
  <span class="section" id="section"></span>
  <span class="counter" id="counter" aria-live="polite"></span>
</header>
<div class="progress"><div id="progress"></div></div>
<main id="stage"></main>
<nav class="controls" aria-label="Slides">
  <button id="prev" type="button">← Previous</button>
  <button id="next" type="button">Next →</button>
  <span class="hint">Arrow keys, space or swipe</span>
</nav>

<script src="img/shots.js"></script>
<script>
const REPO = 'https://github.com/DeepBlueCLtd/BrowserTest/blob/main/';
const DEMO = 'https://DeepBlueCLtd.github.io/BrowserTest/main/';

/**
 * Slides. A screenshot slide has `shot` (image id) and `notes`, each tied to a
 * pin measured by the capture script. A text slide has `html`.
 */
const SLIDES = [
  {
    section: 'Overview',
    html: `
      <h1>Sonar Quiz System</h1>
      <p class="lede">A layer that turns DITA training pages, published by Oxygen WebHelp, into
      self-marking quizzes and analysis worksheets. It runs from local disk with no network, on a
      classroom machine that students and the instructor share.</p>
      <div class="cards">
        <div class="card"><b>Students</b>Log in with name, service ID and PIN. Answer quizzes,
        fill in analysis tables, track progress.</div>
        <div class="card"><b>Instructors</b>See every student's answers on the page, scores,
        retries and analysis work. Export CSV, reset PINs, erase a cohort.</div>
        <div class="card"><b>Authors</b>Write ordinary DITA tables in Oxygen. The publishing
        template does the rest. No command line.</div>
      </div>
      <p class="note" style="margin-top:18px">Screenshots come from the demo publication on the current
      code. <a href="${DEMO}">Open the live demo</a>.</p>`,
  },

  { section: 'Student', shot: '01-logged-out', title: 'Arriving at a quiz page',
    notes: [
      ['panel', 'The login panel sits in the page header, added by the script with no change to the DITA content.'],
      ['help', 'Help explains the login, including the 4-digit PIN.'],
      ['notice', 'Logged out, the page says how to answer rather than showing a bare list.', 'SRD 013 UX-05'],
      ['table', 'Answers and options are already removed from the page, before anyone logs in.'],
    ] },

  { section: 'Student', shot: '02-validation', title: 'The form explains itself',
    notes: [
      ['hint', 'Every problem is listed at once, so the disabled Login button is always explained.', 'UX-10'],
      ['field', 'Fields the student has touched turn red and are marked invalid for screen readers.'],
      ['button', 'Login stays disabled until the form is valid.'],
    ] },

  { section: 'Student', shot: '03-create', title: 'A new service ID creates an account',
    notes: [
      ['button', 'For a service ID with no account the button reads Create, not a Login that cannot succeed.'],
    ] },

  { section: 'Student', shot: '04-confirm', title: 'The PIN is typed twice',
    notes: [
      ['pin', 'The PIN is entered again, so a typo cannot become the stored PIN.'],
      ['hint', 'The hint says what is needed. After confirming, the student is straight in, with no extra dialog.', 'UX-02'],
    ] },

  { section: 'Student', shot: '05-mcq', title: 'Answering multiple-choice questions',
    notes: [
      ['progress', '"Answered" and "correct" come from the stored record, so they do not change with the page. The template counts the questions in the publication, so it reads "2 of 37 answered".', 'SCO-02, SCO-03'],
      ['header', 'The column is headed "Your answer", whatever the author called it.', 'UX-04'],
      ['correct', 'Right and wrong are shown with a mark and words, not colour alone, and announced to screen readers.', 'A11Y-02'],
      ['incorrect', 'Retries are allowed for learning. The first result and the number of tries are kept for the instructor.', 'SCO-01'],
    ] },

  { section: 'Student', shot: '06-numeric', title: 'Numeric questions',
    notes: [
      ['error', 'Text that is not a number is not saved or counted, and the student is told why.', 'UX-03'],
      ['correct', 'An answer within the author\'s tolerance is marked correct. A number counts as a try when the field is left, so typing slowly is not several tries.'],
    ] },

  { section: 'Student', shot: '07-analysis', title: 'Analysis worksheets',
    notes: [
      ['label', 'Each editable cell is named by its row label for screen readers.', 'A11Y-03'],
      ['cell', 'Students type directly into the table. Entries save automatically.'],
      ['quiz', 'A page can mix an analysis table with verification questions.'],
    ] },

  { section: 'Student', shot: '08-badges', title: 'Progress on the contents page',
    notes: [
      ['amber', 'Amber: started, with questions unanswered or wrong.'],
      ['analysis', 'Analysis work counts: this worksheet turned amber once entries were made.', 'ANA-04'],
      ['red', 'Red: not started. Green means every question right and every analysis cell filled.'],
    ] },

  { section: 'Student', shot: '09-help', title: 'Help says what the colours mean',
    notes: [
      ['modal', 'Each colour has one meaning, matching how page state is worked out.', 'UX-09'],
    ] },

  { section: 'Student', shot: '10-narrow', title: 'Narrower screens',
    notes: [
      ['panel', 'Below 1000 px the panel takes its own header row. At 768 px it used to run off screen and hide Logout.', 'UX-06'],
    ] },

  { section: 'Shared machine', shot: '11-timeout', title: 'Idle sessions end, and say so',
    notes: [
      ['notice', 'After 10 minutes without activity the session ends, so the next student does not inherit it. The form explains why.', 'SEC-09, SEC-10'],
    ] },

  { section: 'Shared machine', shot: '12-lockout', title: 'Wrong PINs lock the account briefly',
    notes: [
      ['banner', 'Three wrong PINs lock that service ID for 30 seconds. PINs are stored salted and slow to guess.', 'SEC-06'],
    ] },

  { section: 'Instructor', shot: '13-instructor-login', title: 'Instructor login',
    notes: [
      ['password', 'The password is checked against a hash in the page. Wrong attempts back off.'],
    ] },

  { section: 'Instructor', shot: '14-instructor-quiz', title: 'The instructor view of a quiz',
    notes: [
      ['toolbar', 'The instructor toolbar replaces the student panel.'],
      ['answer', 'The correct answers come back, from memory, not from the page source.'],
      ['options', 'The options and tolerances come back too.'],
      ['danger', 'Actions that change student data are grouped apart and stay quiet until hovered.', 'UX-08'],
    ] },

  { section: 'Instructor', shot: '15-student-answers', title: 'Every student\'s answers on the page',
    notes: [
      ['toggle', 'Show current answers lists each student under each question.'],
      ['answers', 'Name with the last four digits of the service ID, the answer, and when. Green is right, red is wrong.'],
    ] },

  { section: 'Instructor', shot: '16-analysis-instructor', title: 'Analysis entries side by side',
    notes: [
      ['entries', 'Each student\'s entry appears in the cell it belongs to, with the time it was written.'],
    ] },

  { section: 'Instructor', shot: '17-scores', title: 'Scores',
    notes: [
      ['answered', 'Questions answered, against the publication total when known.', 'SCO-04'],
      ['correct', 'Every percentage says what it is a share of. One right answer no longer reads as 100%.'],
      ['first', 'Right first time: Jo needed a second try on Q1, so it is 1 of 3.'],
      ['tries', 'Retries show on each question.'],
      ['analysis', 'Analysis work shows as cells filled out of the table\'s total.', 'ANA-05'],
    ] },

  { section: 'Instructor', title: 'CSV export', csv: true },

  { section: 'Instructor', shot: '18-reset-pin', title: 'Resetting a student\'s PIN',
    notes: [
      ['password', 'The instructor password is asked for again at the moment of the reset.', 'SEC-03'],
      ['confirm', 'The button stays disabled until it is typed. A wrong password resets nothing.'],
    ] },

  { section: 'Instructor', shot: '19-erase', title: 'Erasing a cohort',
    notes: [
      ['phrase', 'Erase All Data needs the typed phrase…'],
      ['password', '…and the instructor password, so an unattended or faked session cannot wipe the class. Escape closes it.', 'SEC-03, UX-07'],
    ] },

  { section: 'Shared machine', shot: '20-forged-flag', title: 'Faking instructor mode no longer works',
    notes: [
      ['panel', 'This student set the old instructor flag from DevTools and reloaded. Before, that gave the answer key and Erase All Data. Now the stored value is checked against the password hash on every page, and the forged one is cleared.', 'SEC-01, SEC-02'],
      ['table', 'The answers stay hidden.'],
    ] },

  {
    section: 'Publishing',
    html: `
      <h2>What authors do, with no command line</h2>
      <p class="lede">Authors download one zip from the project's Releases page and publish in Oxygen
      as usual.</p>
      <div class="cards">
        <div class="card"><b>1. Download</b><code>oxygen-template-&lt;version&gt;.zip</code>: the template
        with the quiz script inside, the password-hash page, and instructions.</div>
        <div class="card"><b>2. Set parameters</b>Database name, instructor password hash, and a
        13-letter answer key per publication.</div>
        <div class="card"><b>3. Publish</b>The template hides answers, counts the questions and leaves
        out search. A malformed answer stops the build with a clear message.</div>
        <div class="card"><b>4. Check</b>Open a quiz page as a student and as the instructor.</div>
      </div>
      <p class="note" style="margin-top:16px">Full steps and the table rules:
      <a href="${REPO}dita/README.md">dita/README.md</a>.</p>`,
  },

  {
    section: 'Publishing',
    html: `
      <h2>Answers are hidden in the published files</h2>
      <p class="lede">Removing answers from the page at load time stopped "inspect element", but the
      files on disk still held them, and the search box showed them in its results. Now the template
      writes them encoded.</p>
      <p class="note">In the DITA source, as the author writes it:</p>
      <pre>&lt;strow&gt;
  &lt;stentry&gt;What is the typical beam width (degrees)?&lt;/stentry&gt;
  &lt;stentry&gt;15&lt;/stentry&gt;   &lt;!-- answer --&gt;
  &lt;stentry&gt;2&lt;/stentry&gt;    &lt;!-- tolerance --&gt;
&lt;/strow&gt;</pre>
      <p class="note">In the published HTML:</p>
      <pre>&lt;td&gt;What is the typical beam width (degrees)?&lt;/td&gt;
&lt;td&gt;qd1:XR&lt;/td&gt;
&lt;td&gt;qd1:M&lt;/td&gt;</pre>
      <p class="note">This is obfuscation: the key is in the page, so it stops answers being read at a
      glance, not a determined student. Multiple-choice options stay readable, since students see them
      anyway. Details: <a href="${REPO}docs/SECURITY.md">docs/SECURITY.md</a>.</p>`,
  },

  {
    section: 'Under the hood',
    html: `
      <h2>How it fits together</h2>
      <div class="cards">
        <div class="card"><b>Progressive enhancement</b>Finds tables with the <code>qd-quiz</code> and
        <code>qd-analysis</code> classes and upgrades them in place. Without JavaScript the pages still read
        normally.</div>
        <div class="card"><b>Offline</b>One script, loaded from disk over <code>file://</code>. No
        network, no telemetry.</div>
        <div class="card"><b>Storage</b>IndexedDB in the browser, obfuscated in released builds. The
        session lives in the tab and ends after 10 minutes idle.</div>
        <div class="card"><b>Components</b>Lit web components with Shadow DOM for the panels and
        dialogs.</div>
      </div>
      <p style="margin-top:18px">More: <a href="${REPO}docs/MAINTAINERS.md">maintainer guide</a> ·
      <a href="${REPO}docs/SECURITY.md">security</a> ·
      <a href="${REPO}specs/013-classroom-hardening/srd.md">SRD 013</a> (the requirement IDs on these
      slides) · <a href="${DEMO}">live demo</a></p>`,
  },
];

const shots = window.WALKTHROUGH_SHOTS || {};
const stage = document.getElementById('stage');
let index = 0;

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

/** Parse the embedded sample CSV (quoted fields allowed). */
function parseCsv(text) {
  const rows = [];
  let row = [], field = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') quoted = false;
      else field += c;
    } else if (c === '"') quoted = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else field += c;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function renderCsvSlide(slide) {
  const rows = parseCsv(window.WALKTHROUGH_CSV || '');
  const [head = [], ...body] = rows;
  const firstNew = head.indexOf('Kind');
  const th = head.map((h, i) => `<th class="${firstNew >= 0 && i >= firstNew ? 'new' : ''}">${escapeHtml(h)}</th>`).join('');
  const tr = body.map((r) => `<tr>${r.map((c) => `<td>${escapeHtml(c)}</td>`).join('')}</tr>`).join('');
  return `<section class="slide text wide">
    <h2>${escapeHtml(slide.title)}</h2>
    <p class="lede">The export from this walkthrough's session. The original eight columns keep their
    places, so existing spreadsheets still line up. The columns in red are new: Kind (quiz or
    analysis), Attempts, and First Attempt Correct. Analysis rows carry the row label and the text.</p>
    <div class="table-wrap"><table class="csv"><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table></div>
    <p class="note">Fields that could run as spreadsheet formulas are neutralised.</p>
  </section>`;
}

function renderShotSlide(slide) {
  const pins = shots[slide.shot] || {};
  // An outline round each target, numbered on its top-left corner
  const pinHtml = slide.notes
    .map(([id], i) => {
      const p = pins[id];
      if (!p) return '';
      const box = `left:${p.x}%;top:${p.y}%;width:${p.w}%;height:${p.h}%`;
      return `<span class="mark" data-n="${i}" style="${box}"></span>` +
        `<span class="pin" data-n="${i}" style="left:${p.x}%;top:${p.y}%" aria-hidden="true">${i + 1}</span>`;
    })
    .join('');
  const notesHtml = slide.notes
    .map(([, text, ref], i) => `<li data-n="${i}"><span class="num" aria-hidden="true">${i + 1}</span>
      <span>${escapeHtml(text)}${ref ? `<span class="ref">${escapeHtml(ref)}</span>` : ''}</span></li>`)
    .join('');
  return `<section class="slide">
    <figure><div class="shot"><img src="img/${slide.shot}.png" alt="${escapeHtml(slide.title)}">${pinHtml}</div></figure>
    <aside class="notes"><h2>${escapeHtml(slide.title)}</h2><ol class="callouts">${notesHtml}</ol></aside>
  </section>`;
}

function render() {
  const slide = SLIDES[index];
  stage.innerHTML = slide.csv
    ? renderCsvSlide(slide)
    : slide.shot
      ? renderShotSlide(slide)
      : `<section class="slide text">${slide.html}</section>`;
  document.getElementById('section').textContent = slide.section || '';
  document.getElementById('counter').textContent = `${index + 1} / ${SLIDES.length}`;
  document.getElementById('progress').style.width = `${((index + 1) / SLIDES.length) * 100}%`;
  document.getElementById('prev').disabled = index === 0;
  document.getElementById('next').disabled = index === SLIDES.length - 1;
  if (location.hash !== `#${index + 1}`) history.replaceState(null, '', `#${index + 1}`);

  // Link each pin with its caption on hover
  stage.querySelectorAll('[data-n]').forEach((el) => {
    const n = el.dataset.n;
    const toggle = (on) => stage.querySelectorAll(`[data-n="${n}"]`).forEach((m) => m.classList.toggle('hot', on));
    el.addEventListener('mouseenter', () => toggle(true));
    el.addEventListener('mouseleave', () => toggle(false));
  });
}

function go(to) {
  index = Math.max(0, Math.min(SLIDES.length - 1, to));
  render();
}

document.getElementById('prev').addEventListener('click', () => go(index - 1));
document.getElementById('next').addEventListener('click', () => go(index + 1));
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea')) return;
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(index + 1); }
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(index - 1); }
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(SLIDES.length - 1);
});
let touchX = null;
stage.addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX; }, { passive: true });
stage.addEventListener('touchend', (e) => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 50) go(index + (dx < 0 ? 1 : -1));
  touchX = null;
});
window.addEventListener('hashchange', () => {
  const n = parseInt(location.hash.slice(1), 10);
  if (n >= 1 && n <= SLIDES.length && n - 1 !== index) go(n - 1);
});

const start = parseInt(location.hash.slice(1), 10);
index = start >= 1 && start <= SLIDES.length ? start - 1 : 0;
