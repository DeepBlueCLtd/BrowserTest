<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analysis Capture E2E Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 2rem 0;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 0.75rem;
      text-align: left;
    }
    th {
      background-color: #f5f5f5;
    }
    .readonly {
      background-color: #e9ecef;
    }
  </style>
</head>
<body>
  <h1>Analysis Capture Test Page</h1>
  <p>This page is used for E2E testing of analysis table functionality.</p>

  <table class="qd-analysis">
    <thead>
      <tr>
        <th style="background-color: #e9ecef;">Parameter</th>
        <th style="background-color: #e9ecef;">Value</th>
        <th style="background-color: #e9ecef;">Notes</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td style="background-color: #e9ecef;">Temperature</td>
        <td id="cell-temp"></td>
        <td id="cell-temp-notes"></td>
      </tr>
      <tr>
        <td style="background-color: #e9ecef;">Pressure</td>
        <td id="cell-pressure"></td>
        <td id="cell-pressure-notes"></td>
      </tr>
      <tr>
        <td style="background-color: #e9ecef;">Salinity</td>
        <td id="cell-salinity"></td>
        <td id="cell-salinity-notes"></td>
      </tr>
    </tbody>
  </table>

  <script type="module">
    // Import and initialize the enhancer
    import { enhanceAllAnalysisTables } from '../../../dist/sonar-quiz.esm.js';

    document.addEventListener('DOMContentLoaded', () => {
      enhanceAllAnalysisTables();
    });
  </script>
</body>
</html>
